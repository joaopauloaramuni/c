    <!-- Aplica o tema (light/dark) ANTES do React carregar, para não piscar.
         A chave "sitec:theme" é a mesma do src/config/site.js -->
    <script>
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem("sitec:theme");
        } catch (e) {}
        if (tema !== "light" && tema !== "dark") {
          tema = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
